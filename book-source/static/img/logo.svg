<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <defs>
    <linearGradient id="vectraEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagon Frame -->
  <polygon points="18,2 32,10 32,26 18,34 4,26 4,10" stroke="url(#vectraEmblem)" stroke-width="2" fill="none" opacity="0.85"/>

  <!-- Inner Cybernetic V / Chevron Structure -->
  <path d="M10,12 L18,26 L26,12 L21,12 L18,18 L15,12 Z" fill="url(#vectraEmblem)" filter="url(#emblemGlow)"/>

  <!-- Core Precision Sensor Dot -->
  <circle cx="18" cy="11" r="2.5" fill="#00ff9d"/>
</svg>
